<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IntentScroll · Learn with intent</title>
<meta name="description" content="IntentScroll turns doomscrolling into learning: topic tabs, relevant short videos, and AI key ideas.">
<meta name="theme-color" content="#f4f4f0">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:title" content="IntentScroll">
<meta property="og:description" content="Doomscroll with intent.">
<meta property="og:image" content="/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="/og-image.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap">
<style>
:root{--bg:#f4f4f0;--ink:#000;--card:#fff;--line:#000;--soft:rgba(0,0,0,.15);--muted:#6b6b66;--blue:#dff0ff;--lime:#efffd9;--accent:#b7f565;--violet:#4c38ff;--danger:#b42318;--ring:#ddd;--on:#000;--onink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10110f;--ink:#f4f4f0;--card:#1d1e1b;--line:#777;--soft:#3d3e39;--muted:#a3a39b;--blue:#242721;--lime:#242721;--ring:#3a3b36;--on:#f4f4f0;--onink:#111;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10110f;--ink:#f4f4f0;--card:#1d1e1b;--line:#777;--soft:#3d3e39;--muted:#a3a39b;--blue:#242721;--lime:#242721;--ring:#3a3b36;--on:#f4f4f0;--onink:#111;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;min-width:320px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:disabled{cursor:not-allowed;opacity:.3}
.ic{width:24px;height:24px;flex:none}
.top{height:80px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:0 20px}
.brand{font-weight:800;font-size:20px;letter-spacing:-.05em;min-height:44px}
.tag{font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;margin-right:12px}
.circ{display:grid;place-items:center;width:44px;height:44px;border:1px solid currentColor;border-radius:50%}
main{max-width:1200px;margin:0 auto;padding:36px 20px 150px;animation:in .38s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
h1{margin:8px 0 0;font-weight:700;letter-spacing:-.06em;line-height:.98;font-size:clamp(2.6rem,8vw,5.5rem)}
.eye{font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
.sub{color:var(--muted);font-size:14px}
.grid{display:grid;gap:20px}.g3{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.pc{border:1px solid var(--soft);border-radius:32px;padding:clamp(22px,4vw,36px);background:var(--card);box-shadow:0 16px 50px rgba(0,0,0,.06);transition:transform .28s,box-shadow .28s}
.pc:hover{transform:translateY(-3px)}
.dk{background:#000;color:#fff;border-color:#000}.bl{background:var(--blue)}.li{background:var(--lime)}.vi{background:var(--violet);color:#fff;text-align:left;display:block;width:100%}
.rb{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:var(--on);color:var(--onink)}
.ring{display:grid;place-items:center;width:64px;height:64px;border-radius:50%;flex:none}
.ring i{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:var(--card);font:700 12px Manrope;font-style:normal}
.row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;width:100%;text-align:left;padding:16px 0;border-bottom:1px solid var(--soft);min-height:90px}
.pb{background:var(--on);color:var(--onink);border-radius:999px;min-height:48px;padding:12px 24px;font-weight:700}
.sb{border:1px solid var(--line);border-radius:999px;min-height:48px;padding:12px 24px;font-weight:700}
.db{background:var(--danger);color:#fff;border-radius:999px;min-height:48px;padding:12px 24px;font-weight:700}
.field{display:grid;gap:8px;font-size:14px;font-weight:700}
.field input,.field select{min-height:56px;width:100%;border:1px solid #c8c8c4;border-radius:16px;background:var(--card);color:var(--ink);padding:0 16px;font:inherit;font-weight:400;outline:none}
.field input:focus,.field select:focus{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
.hd{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--line);padding-bottom:28px;gap:12px}
.hd h1{font-size:clamp(3rem,10vw,6.5rem)}
.plus{display:grid;place-items:center;width:64px;height:64px;border-radius:50%;background:var(--on);color:var(--onink);font-size:32px;flex:none}
.tr{display:grid;grid-template-columns:2.5rem 1fr auto auto;gap:12px;align-items:center;border-bottom:1px solid var(--line);min-height:116px}
.tr strong{font-size:clamp(1.2rem,4vw,1.9rem)}
.rm{display:grid;place-items:center;width:44px;height:44px;border:1px solid var(--soft);border-radius:50%;color:var(--muted)}
.rm:hover{background:#fee2e2;color:#991b1b}
.bar{height:8px;border-radius:99px;background:var(--ring);overflow:hidden}.bar b{display:block;height:100%;background:var(--on);border-radius:99px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;border-top:1px solid var(--line);background:color-mix(in srgb,var(--bg) 95%,transparent);backdrop-filter:blur(10px);padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px))}
nav div{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:500px;margin:auto}
nav button{display:flex;gap:8px;align-items:center;justify-content:center;min-height:56px;border-radius:999px;font-size:14px;font-weight:600}
nav button[aria-pressed=true]{background:var(--on);color:var(--onink)}
@media(min-width:640px){nav{left:50%;right:auto;bottom:20px;width:500px;transform:translateX(-50%);border:1px solid var(--line);border-radius:999px;padding:12px}.top{padding:0 32px}main{padding:48px 32px 150px}}
.mb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:grid;place-items:end center;padding:12px}
@media(min-width:640px){.mb{place-items:center}}
.mp{width:100%;max-width:512px;max-height:92vh;overflow:auto;border-radius:32px;background:var(--bg);padding:28px;box-shadow:0 30px 80px rgba(0,0,0,.4);animation:in .3s}
.mp h2{margin:0;font-size:24px;letter-spacing:-.02em}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.x{width:44px;height:44px;border:1px solid var(--line);border-radius:50%;font-size:22px}
.set{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;width:100%;text-align:left;border:1px solid var(--soft);border-radius:20px;padding:12px;min-height:80px;margin-bottom:12px}
.tg{width:48px;height:28px;border-radius:99px;padding:3px;background:#ccc}.tg span{display:block;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.tg.on{background:var(--on)}.tg.on span{transform:translateX(20px);background:var(--onink)}
.sg{display:grid;gap:8px;margin-top:20px}
.opt{min-height:56px;border:1px solid #c8c8c4;border-radius:16px;padding:0 16px;text-align:left;font-weight:600}
.opt.sel{background:var(--on);color:var(--onink);border-color:var(--on)}
.feed{position:fixed;inset:0;z-index:40;background:#000;color:#fff;overflow-y:auto;scroll-snap-type:y mandatory}
.back{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:16px;z-index:5;display:flex;gap:6px;align-items:center;min-height:48px;padding:0 16px;border-radius:999px;background:#fff;color:#000;font-weight:700}
.fp{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:16px;z-index:5;min-height:48px;display:flex;align-items:center;padding:0 16px;border-radius:999px;background:rgba(255,255,255,.15);font-size:13px;font-weight:800}
.fc{scroll-snap-align:start;height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:76px 12px 16px;gap:10px;text-align:center}
.fr{aspect-ratio:9/16;max-height:calc(100% - 40px);max-width:100%;border-radius:18px;overflow:hidden;background:#111}
.fr iframe{width:100%;height:100%;border:0;display:block}
.fc a{color:#b7f565}
.empty{padding:32px 8px;text-align:center;color:var(--muted)}
.lnk{display:inline-flex;align-items:center;min-height:48px;text-decoration:none}
.sc{border-radius:24px;background:var(--card);padding:18px;border:1px solid var(--soft)}
.toast{position:fixed;left:0;right:0;margin:auto;width:max-content;max-width:90vw;bottom:110px;z-index:60;background:#000;color:#fff;padding:14px 20px;border-radius:999px;font-weight:700;font-size:14px;animation:in .3s}.toast.err{background:var(--danger)}
.logo{height:30px;width:auto;display:block;flex:none}.brand{display:flex;align-items:center;gap:10px}
:root[data-theme="dark"] .logo{filter:brightness(0) invert(.95)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo{filter:brightness(0) invert(.95)}}
.fr{position:relative}.tap{position:absolute;inset:0;z-index:2;background:transparent}.pi{position:absolute;inset:0;display:grid;place-items:center;font-size:72px;color:#fff;text-shadow:0 2px 20px rgba(0,0,0,.6);pointer-events:none;opacity:0;z-index:3;transition:opacity .2s}.pi.on{opacity:.9}
.ftop{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:16px;z-index:5;display:flex;gap:8px}.ftop .fp{position:static;color:#fff}
.low *{animation:none!important;transition:none!important;backdrop-filter:none!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div><div id="modal"></div><div id="feed"></div>
<script src="/app.js" defer></script>
</body>
</html>
